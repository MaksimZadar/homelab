apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik2.k3s.zadar.family`) # change this to your domain
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: zadar-family-tls-test # change this to your secret!!!
