# docker run -d -p 8000:8000 -p 9443:9443
# --name portainer --restart=always -v /var/run/docker.sock:/var/run/docker.sock
# -v portainer_data:/data portainer/portainer-ce:lts
services:
  portainer-ce:
    image: portainer/portainer-ce:${PORTAINER_TAG:-lts}
    container_name: portainer-ce
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=https"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST_DOMAIN}`)"
      - "traefik.http.routers.portainer.service=portainer-service"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=cloudflare"

volumes:
  portainer_data:

networks:
  proxy:
    external: true
