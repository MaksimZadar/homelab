services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: "https://${DOCMOST_DOMAIN}"
      APP_SECRET: "48d583315c9910bf656275871d9a1d5ed81af0b9801f8944e31c4e8d78f6bfe9"
      DATABASE_URL: "postgresql://docmost:${PG_PASS}@db:5432/docmost?schema=public"
      REDIS_URL: "redis://redis:6379"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
    networks:
      - docmost
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.docmost.entrypoints=https
      - traefik.http.routers.docmost.tls=true
      - traefik.http.routers.docmost.rule=Host(`${DOCMOST_DOMAIN}`)
      - traefik.http.services.docmost.loadbalancer.server.port=3000
      - traefik.http.routers.docmost.service=docmost
      - traefik.http.routers.docmost.tls.certresolver=cloudflare

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${PG_PASS}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - docmost

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - docmost

volumes:
  docmost:
    driver: rclone
    driver_opts:
      remote: "minio:docmost"
      allow_other: "true"
      vfs_cache_mode: "full"
  db_data:
  redis_data:

networks:
  docmost:
  proxy:
    external: true
